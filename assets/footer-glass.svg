<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 92" width="100%" role="img" aria-label="System Status Footer">
  <defs>
    <filter id="footerBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" />
    </filter>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>
    <linearGradient id="footerGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.11" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
    <linearGradient id="footerRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.45" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>

  <rect width="880" height="92" rx="18" fill="url(#footerBg)" />
  <g filter="url(#footerBlur)">
    <circle cx="160" cy="46" r="45" fill="#06b6d4" opacity="0.45" />
    <circle cx="720" cy="46" r="45" fill="#a855f7" opacity="0.45" />
  </g>

  <rect x="12" y="10" width="856" height="72" rx="14" fill="url(#footerGlass)" stroke="url(#footerRim)" stroke-width="1.2" />

  <!-- Pixel Heart + Terminal Signoff -->
  <g transform="translate(34, 34)" shape-rendering="crispEdges">
    <rect x="4" y="0" width="6" height="4" fill="#38bdf8" />
    <rect x="14" y="0" width="6" height="4" fill="#38bdf8" />
    <rect x="0" y="4" width="24" height="6" fill="#38bdf8" />
    <rect x="4" y="10" width="16" height="4" fill="#818cf8" />
    <rect x="8" y="14" width="8" height="4" fill="#a855f7" />
    <rect x="10" y="18" width="4" height="4" fill="#c084fc" />
  </g>

  <text x="76" y="42" class="mono" font-size="13" font-weight="700" fill="#f8fafc">
    CONCEPTS &gt; CODE · SOLID FOUNDATIONS · ZERO SHORTCUTS
  </text>
  <text x="76" y="62" class="mono" font-size="11.5" fill="#94a3b8">
    Fabian131 (xxTYBUxx) · Universidad Nacional de Costa Rica · Built with Self-Hosted SVGs &amp; GitHub Actions
  </text>

  <circle class="pulse" cx="826" cy="46" r="5" fill="#22c55e" />
</svg>

